<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Comanda - Pizzaria Italia</title>
    <!-- Carregando a biblioteca Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d32f2f; }
        label { font-weight: bold; margin-top: 15px; display: block; font-size: 0.9em; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .btn-capture { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-green { background: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        .btn-gray { background: #6c757d; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        #status { text-align: center; margin: 10px 0; color: #555; font-weight: bold; min-height: 20px; }
        #videoPreview { width: 100%; border-radius: 8px; background: black; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍕 Pizzaria Italia</h2>
    
    <button class="btn-capture" id="btnCamera" onclick="abrirCamera()">📸 Abrir Câmera</button>
    
    <div id="containerCamera" style="display:none;">
        <video id="videoPreview" autoplay playsinline></video>
        <button class="btn-capture" style="background:#28a745; margin-top: 10px;" onclick="capturar()">Capturar e Ler Comanda</button>
    </div>

    <div id="status"></div>

    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Ex: Junior">
    
    <label>Telefone:</label>
    <input type="tel" id="telefone" placeholder="Ex: 63992192222">

    <button class="btn-green" onclick="enviarLink()">Enviar no WhatsApp</button>
    <button class="btn-gray" onclick="copiarParaAreaDeTransferencia()">📋 Copiar Link</button>
</div>

<script>
    const NUMERO_PIZZARIA = "63992744095"; 
    let stream = null;

    async function abrirCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } }
            });
            document.getElementById('videoPreview').srcObject = stream;
            document.getElementById('containerCamera').style.display = 'block';
            document.getElementById('btnCamera').style.display = 'none';
            document.getElementById('status').innerText = "Aponte para o Nome e Telefone";
        } catch(e) { 
            alert("Erro ao acessar câmera: " + e.message);
        }
    }

    // Filtro para aumentar contraste e ajudar o Tesseract
    function processarImagem(canvas) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            let v = (avg > 120) ? 255 : 0; // Binarização forte
            data[i] = data[i + 1] = data[i + 2] = v;
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    async function capturar() {
        const video = document.getElementById('videoPreview');
        const statusDiv = document.getElementById('status');
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; 
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('containerCamera').style.display = 'none';
        document.getElementById('btnCamera').style.display = 'block';

        statusDiv.innerText = "⏳ Analisando...";

        const canvasFinal = processarImagem(canvas);

        Tesseract.recognize(canvasFinal, 'por').then(({ data: { text } }) => {
            console.log("Texto detectado:", text); // Debug para você ver o que foi lido
            
            // 1. Extração de Nome
            const matchNome = text.match(/Nome:\s*([^\n\r]+)/i);
            if(matchNome) document.getElementById('nome').value = matchNome[1].trim();

            // 2. Extração de Telefone (Focada no seu formato)
            // Procura "Telefone:", ignora espaços/parenteses/traços e pega 11 dígitos
            const matchTel = text.match(/Telefone:\s*\(?(\d{2})\)?\s*(\d{1})\s*(\d{4})[- ]?(\d{4})/i);
            
            if(matchTel) {
                // Junta os grupos: [1]DDD + [2]9 + [3]4digitos + [4]4digitos
                const numeroFinal = matchTel[1] + matchTel[2] + matchTel[3] + matchTel[4];
                document.getElementById('telefone').value = numeroFinal;
                statusDiv.innerText = "✅ Leitura concluída!";
            } else {
                // Tentativa de emergência: qualquer sequência de 11 números
                const nums = text.replace(/\D/g, '').match(/\d{11}/);
                if(nums) {
                    document.getElementById('telefone').value = nums[0];
                    statusDiv.innerText = "✅ Leitura concluída (via busca direta)!";
                } else {
                    statusDiv.innerText = "❌ Não detectado. Tente uma foto mais nítida.";
                    alert("Não consegui ler o telefone. Tente aproximar a câmera.");
                }
            }
        });
    }

    function enviarLink() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        let nome = document.getElementById('nome').value;
        if(!tel) return alert("Preencha o telefone!");
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=Olá ${nome}, aqui é da Pizzaria Italia.`, '_blank');
    }

    function copiarParaAreaDeTransferencia() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        let nome = document.getElementById('nome').value;
        if(!tel) return alert("Preencha o telefone!");
        let link = `https://wa.me/55${tel}?text=Olá ${nome}, aqui é da Pizzaria Italia.`;
        navigator.clipboard.writeText(link).then(() => alert("Copiado!"));
    }
</script>
</body>
</html>
