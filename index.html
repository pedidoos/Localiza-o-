<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Leitor de Comanda</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-capture { background: #d32f2f; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .debug-area { font-size: 9px; color: #888; margin-top: 10px; height: 60px; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍕 Pizzaria Italia</h2>
    <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none" onchange="ler(event)">
    <button class="btn-capture" onclick="document.getElementById('fotoInput').click()">📸 TIRAR FOTO</button>
    
    <label>Nome:</label>
    <input type="text" id="nome">
    <label>Telefone:</label>
    <input type="tel" id="telefone">
    <button style="width:100%; margin-top:10px; padding:10px; background:#25D366; border:none; color:white; font-weight:bold; border-radius:5px;" onclick="enviar()">ENVIAR WHATSAPP</button>
    
    <textarea id="debug" class="debug-area" readonly placeholder="Texto lido pelo sistema..."></textarea>
</div>

<script>
    async function ler(event) {
        const file = event.target.files[0];
        if(!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; 
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // Filtro de contraste extremo para destacar números
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for(let i=0; i<imgData.data.length; i+=4) {
                let v = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
                v = v < 128 ? 0 : 255; // Binarização absoluta
                imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = v;
            }
            ctx.putImageData(imgData, 0, 0);

            Tesseract.recognize(canvas, 'por').then(({ data: { text } }) => {
                document.getElementById('debug').value = text; // Veja o que ele leu aqui

                // EXTRAÇÃO DO NOME
                // Pega a linha que contém "Nome" ou "Cliente" e tira tudo que não é letra
                const matchNome = text.match(/(Nome|Cliente)[:\s]*([A-Za-zÀ-ÿ ]+)/i);
                if(matchNome) document.getElementById('nome').value = matchNome[2].trim();

                // EXTRAÇÃO DO TELEFONE (A NOVA ESTRATÉGIA)
                // 1. Remove absolutamente tudo que NÃO for número
                const apenasNumeros = text.replace(/[^0-9]/g, '');
                
                // 2. Procura uma sequência de 11 números que comece com 639
                const matchTel = apenasNumeros.match(/639\d{8}/);
                
                if(matchTel) {
                    document.getElementById('telefone').value = matchTel[0];
                } else {
                    alert("OCR não achou número começando com 63. Verifique a caixa 'Texto lido' abaixo.");
                }
            });
        };
    }

    function enviar() {
        let tel = document.getElementById('telefone').value;
        let nome = document.getElementById('nome').value;
        window.open(`https://wa.me/55${tel}?text=Olá ${nome}, aqui é da Pizzaria Italia. Poderia confirmar sua localização para entrega?`, '_blank');
    }
</script>
</body>
</html>
