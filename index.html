<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Comanda - Pizzaria Italia</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 420px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d32f2f; margin-top: 0; }
        label { font-weight: bold; margin-top: 15px; display: block; font-size: 14px; color: #333; }
        input, button, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        .btn-capture { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }
        .btn-green { background: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 12px; }
        .btn-gray { background: #6c757d; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 8px; }
        #status { text-align: center; margin: 12px 0; color: #d32f2f; font-weight: bold; font-size: 14px; }
        #previewImg { width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ddd; }
        .debug-box { font-size: 10px; color: #666; background: #f8f9fa; height: 50px; resize: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍕 Pizzaria Italia</h2>
    
    <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none" onchange="processarFoto(event)">
    <button class="btn-capture" onclick="document.getElementById('fotoInput').click()">📸 Tirar Foto da Comanda</button>
    
    <img id="previewImg">
    <div id="status"></div>

    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Nome do cliente">
    
    <label>Telefone:</label>
    <input type="tel" id="telefone" placeholder="Telefone do cliente">

    <button class="btn-green" onclick="enviarLink()">Enviar no WhatsApp</button>
    <button class="btn-gray" onclick="copiarParaAreaDeTransferencia()">📋 Copiar Link</button>

    <textarea id="debugText" class="debug-box" readonly placeholder="Diagnóstico da leitura..."></textarea>
</div>

<script>
    const NUMERO_PIZZARIA = "63992744095";

    async function processarFoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('status');
        const debugText = document.getElementById('debugText');
        
        document.getElementById('previewImg').src = URL.createObjectURL(file);
        document.getElementById('previewImg').style.display = 'block';
        statusDiv.innerText = "⏳ Processando...";
        debugText.value = "";

        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            // REDIMENSIONAMENTO: Limita a 1200px de largura para acelerar o Tesseract sem perder qualidade
            const MAX_WIDTH = 1200;
            const scale = Math.min(1, MAX_WIDTH / img.width);
            
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // OCR Rápido
            Tesseract.recognize(canvas, 'por').then(({ data: { text } }) => {
                debugText.value = text;
                
                // Extração Nome
                const matchNome = text.match(/Nome:\s*([^\n\r]+)/i);
                if (matchNome && matchNome[1]) {
                    document.getElementById('nome').value = matchNome[1].replace(/[^a-zA-ZÀ-ÿ\s]/g, '').trim();
                }

                // Extração Telefone
                const apenasNumeros = text.replace(/Telefone:/i, 'TAG_TEL').replace(/\D/g, '');
                const matchTel = text.match(/(?:Telefone|Celular|WhatsApp)[:\s]*.*?(\d{2})\s*(\d{1})\s*(\d{4})[- ]?(\d{4})/i);
                
                if (matchTel) {
                    document.getElementById('telefone').value = matchTel[1] + matchTel[2] + matchTel[3] + matchTel[4];
                } else {
                    const fallback = text.replace(/\D/g, '').match(/\d{11}/);
                    if(fallback) document.getElementById('telefone').value = fallback[0];
                }

                statusDiv.innerText = "✅ Leitura rápida concluída!";
            });
        };
    }

    function getMensagem() {
        const nome = document.getElementById('nome').value || "Cliente";
        return encodeURIComponent(`Olá ${nome}, aqui é da Pizzaria Italia. Seu pedido está em preparo! Por favor, poderia nos enviar sua localização atual para a entrega?`);
    }

    function enviarLink() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        if (!tel) return alert("Preencha o telefone!");
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${getMensagem()}`, '_blank');
    }

    function copiarParaAreaDeTransferencia() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        if (!tel) return alert("Preencha o telefone!");
        let link = `https://wa.me/55${tel}?text=${getMensagem()}`;
        navigator.clipboard.writeText(link).then(() => alert("Copiado com sucesso!"));
    }
</script>
</body>
</html>
