<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor - Pizzaria Italia</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 420px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d32f2f; margin-top: 0; }
        label { font-weight: bold; margin-top: 15px; display: block; font-size: 14px; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        .btn-capture { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-green { background: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 12px; }
        #status { text-align: center; margin: 12px 0; color: #d32f2f; font-weight: bold; }
        #debug { font-size: 10px; color: #999; margin-top: 10px; height: 50px; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍕 Pizzaria Italia</h2>
    <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none" onchange="processar(event)">
    <button class="btn-capture" onclick="document.getElementById('fotoInput').click()">📸 Tirar Foto</button>
    <div id="status"></div>
    <label>Nome:</label>
    <input type="text" id="nome">
    <label>Telefone:</label>
    <input type="tel" id="telefone">
    <button class="btn-green" onclick="enviar()">Enviar WhatsApp</button>
    <textarea id="debug" readonly placeholder="Texto lido..."></textarea>
</div>

<script>
    async function processar(event) {
        const file = event.target.files[0];
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');
        status.innerText = "⏳ Lendo...";
        
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            
            Tesseract.recognize(canvas, 'por').then(({ data: { text } }) => {
                debug.value = text;
                
                // 1. Extração de Nome: Procura a linha que começa com "Nome"
                const matchNome = text.match(/(?:Nome|Cliente|Entregar para)[:\s]*([A-Za-zÀ-ÿ ]+)/i);
                if (matchNome) document.getElementById('nome').value = matchNome[1].trim();

                // 2. Extração de Telefone: Esquece o rótulo "Telefone", busca apenas o padrão de números
                // Remove tudo que não é número
                const apenasNumeros = text.replace(/\D/g, '');
                
                // Busca uma sequência de 11 dígitos que comece com 639 (DDD 63 + o 9 do celular)
                const matchTel = apenasNumeros.match(/639\d{8}/);
                
                if (matchTel) {
                    document.getElementById('telefone').value = matchTel[0];
                    status.innerText = "✅ Leitura concluída!";
                } else {
                    status.innerText = "⚠️ Telefone não achado. Tente foto mais nítida.";
                }
            });
        };
    }

    function enviar() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        let nome = encodeURIComponent(document.getElementById('nome').value);
        let msg = encodeURIComponent("Olá, aqui é da Pizzaria Italia. Seu pedido está sendo preparado! Poderia confirmar sua localização para entrega?");
        if (!tel) return alert("Preencha o telefone!");
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${nome},%20${msg}`, '_blank');
    }
</script>
</body>
</html>
