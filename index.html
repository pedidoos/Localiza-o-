<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Comanda - Pizzaria Italia</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { font-weight: bold; font-size: 14px; color: #333; margin-top: 10px; display: block; }
        input, button { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        .btn-capture { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-link { background: #25D366; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-copy { background: #6c757d; color: white; font-weight: bold; border: none; cursor: pointer; }
        #status { font-size: 13px; color: #666; text-align: center; font-weight: bold; margin: 8px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍕 Pizzaria Italia</h2>
    
    <button class="btn-capture" id="btnCamera" onclick="abrirCamera()">📸 Abrir Câmera</button>
    
    <div id="containerCamera" style="display:none;">
        <video id="videoPreview" autoplay playsinline style="width:100%; background:#000; border-radius:8px;"></video>
        <button class="btn-capture" style="background:#28a745; margin-top: 10px;" onclick="capturar()">Capturar e Ler</button>
    </div>

    <div id="status"></div>

    <label for="nome">Nome do Cliente:</label>
    <input type="text" id="nome" placeholder="Nome extraído aparecerá aqui">

    <label for="telefone">Telefone / WhatsApp:</label>
    <input type="tel" id="telefone" placeholder="Apenas números (ex: 63999999999)">

    <button class="btn-link" onclick="enviarLink()">Enviar WhatsApp</button>
    <button class="btn-copy" onclick="copiarParaAreaDeTransferencia()">📋 Copiar Link (Pessoal)</button>
</div>

<script>
    const NUMERO_PIZZARIA = "63992744095"; 
    let stream = null;

    async function abrirCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, advanced: [{ torch: true }] }
            });
            document.getElementById('videoPreview').srcObject = stream;
            document.getElementById('containerCamera').style.display = 'block';
            document.getElementById('btnCamera').style.display = 'none';
        } catch(e) { 
            abrirCameraSemFlash();
        }
    }

    async function abrirCameraSemFlash() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
            document.getElementById('videoPreview').srcObject = stream;
            document.getElementById('containerCamera').style.display = 'block';
            document.getElementById('btnCamera').style.display = 'none';
        } catch(err) {
            alert("Não foi possível acessar a câmera.");
        }
    }

    // Processamento de imagem para melhorar leitura do OCR (Aumenta Contraste/Binarização)
    function préProcessarImagem(canvas) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            // Converte para escala de cinza
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            // Aumenta o contraste (limiar de preto/branco)
            let v = (avg > 120) ? 255 : 0;
            data[i] = v;     // R
            data[i + 1] = v; // G
            data[i + 2] = v; // B
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    async function capturar() {
        const video = document.getElementById('videoPreview');
        const statusDiv = document.getElementById('status');
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; 
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('containerCamera').style.display = 'none';
        document.getElementById('btnCamera').style.display = 'block';

        statusDiv.innerText = "⏳ Lendo comanda com precisão...";

        // Processa o canvas para nitidez extrema
        const canvasProcessado = préProcessarImagem(canvas);

        Tesseract.recognize(canvasProcessado, 'por', {
            tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÁÉÍÓÚáéíóúÃÕãõÂÊÔâêôÇç:-() '
        }).then(({ data: { text } }) => {
            statusDiv.innerText = "";

            // 1. EXTRAÇÃO DE NOME (Suporta Nomes Compostos e Rótulos Diversos)
            const matchNome = text.match(/(?:Nome|Cliente|Entregar para|Atender|Para):\s*([A-Za-zÀ-ÿ\s]{2,30})/i);
            if (matchNome && matchNome[1]) {
                document.getElementById('nome').value = matchNome[1].trim();
            }

            // 2. EXTRAÇÃO DE TELEFONE PRECISA
            // Busca padrões de números com DDD (10 ou 11 dígitos, com ou sem formatação)
            const regexTelefone = /(?:\(?\d{2}\)?\s*)?(?:9\s*)?\d{4}[-\s]*\d{4}/g;
            const telefonesEncontrados = text.match(regexTelefone);

            let telefoneValido = null;

            if (telefonesEncontrados) {
                for (let tel of telefonesEncontrados) {
                    let numLimpo = tel.replace(/\D/g, '');
                    
                    // Adiciona DDD padrão 63 caso a leitura pegue apenas 8 ou 9 dígitos sem DDD
                    if (numLimpo.length === 8 || numLimpo.length === 9) {
                        numLimpo = "63" + numLimpo;
                    }

                    // Aceita celulares/fixos brasileiros válidos (10 ou 11 dígitos) e exclui o número da pizzaria
                    if ((numLimpo.length === 10 || numLimpo.length === 11) && numLimpo !== NUMERO_PIZZARIA) {
                        telefoneValido = numLimpo;
                        break;
                    }
                }
            }

            if (telefoneValido) {
                document.getElementById('telefone').value = telefoneValido;
            } else {
                alert("Aviso: Não foi possível detectar o telefone com clareza. Verifique o campo.");
            }
        }).catch(err => {
            statusDiv.innerText = "";
            alert("Erro ao ler comanda. Tente aproximar mais a câmera.");
        });
    }

    function enviarLink() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        let nome = document.getElementById('nome').value;
        if(!tel) return alert("Preencha o telefone!");
        window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=Olá ${nome}, aqui é da Pizzaria Italia.`, '_blank');
    }

    function copiarParaAreaDeTransferencia() {
        let tel = document.getElementById('telefone').value.replace(/\D/g, '');
        let nome = document.getElementById('nome').value;
        if(!tel) return alert("Preencha o telefone!");
        let link = `https://wa.me/55${tel}?text=Olá ${nome}, aqui é da Pizzaria Italia.`;
        navigator.clipboard.writeText(link).then(() => alert("Copiado! Cole no WhatsApp."));
    }
</script>
</body>
</html>
